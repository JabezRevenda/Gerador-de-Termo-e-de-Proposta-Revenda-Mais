<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --red: #E8003D; --red-dark: #B5002F; --red-light: rgba(232,0,61,0.07);
  --ink: #0b0b0f; --bg: #f2f3f6; --card: #fff; --border: #eceef2; --field: #f5f6f8;
  --text: #1f2937; --heading: #111827; --muted: #6b7280; --dim: #9ca3af;
  --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 8px 28px rgba(17,24,39,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
button { font-family: inherit; }

.topo {
  position: sticky; top: 0; z-index: 10; height: 64px; padding: 0 28px;
  background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px;
}
.topo img { height: 26px; display: block; }
.topo-t { font-size: 14px; font-weight: 500; color: var(--muted); padding-left: 16px; border-left: 1px solid var(--border); }
.topo-reset { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 8px 10px; border-radius: 10px; }
.topo-reset:hover { color: var(--heading); background: var(--field); }

.pagina { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 24px; align-items: start; }
.passos { display: flex; flex-direction: column; gap: 18px; }

/* Produto: Software Gerencial (padrão) ou um produto sozinho */
.produtos { grid-column: 1 / -1; display: flex; gap: 6px; background: #e8e9ed; border-radius: 16px; padding: 5px; width: max-content; max-width: 100%; overflow-x: auto; }
.produtos button { border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--muted); padding: 10px 18px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
.produtos button:hover { color: var(--heading); }
.produtos button.on { background: #fff; color: var(--red); box-shadow: var(--shadow); }

.bloco { background: var(--card); border-radius: 24px; padding: 26px 28px 28px; box-shadow: var(--shadow); }
.bloco-t { font-size: 19px; font-weight: 700; color: var(--heading); letter-spacing: -0.01em; margin-bottom: 16px; }

/* Plano: pergunta, preço grande e a faixa de veículos */
.plano-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.plano-q { font-size: 19px; font-weight: 600; color: var(--heading); line-height: 1.3; }
.plano-q small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 4px; }
.preco { text-align: right; white-space: nowrap; }
.preco b { font-size: 32px; font-weight: 800; color: var(--heading); letter-spacing: -0.02em; }
.preco span { font-size: 15px; color: var(--muted); }
.preco small { display: block; font-size: 14px; font-weight: 600; color: var(--red); margin-top: 2px; }

.faixa-box { margin-top: 22px; padding: 18px 22px 16px; border: 1px solid var(--border); border-radius: 18px; }
.marcas { display: flex; justify-content: space-between; margin-bottom: 10px; }
.marcas button { border: 0; background: none; font-size: 17px; font-weight: 700; color: var(--dim); cursor: pointer; padding: 2px 4px; }
.marcas button.on { color: var(--heading); }
.marcas button small { display: block; font-size: 11.5px; font-weight: 500; }
.faixa { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; outline: none; cursor: pointer;
  background: linear-gradient(90deg, var(--red) var(--p), #e5e7eb var(--p)); }
.faixa::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--red); box-shadow: 0 2px 8px rgba(232,0,61,0.3); }
.faixa::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--red); }
.plano-info { margin-top: 14px; font-size: 15px; color: var(--text); }
.plano-info b { color: var(--red); }

/* O que vem no plano: ✓ no que vem, ✕ riscado no que não vem */
.recursos-t { font-size: 16px; font-weight: 700; color: var(--heading); margin: 24px 0 12px; }
.recursos { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; }
.recursos li { display: flex; align-items: flex-start; gap: 9px; font-size: 14.5px; color: var(--heading); line-height: 1.35; }
.recursos li::before { content: '✓'; flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; background: #16a34a; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.recursos li.nao { color: var(--dim); text-decoration: line-through; }
.recursos li.nao::before { content: '✕'; background: #fde8ec; color: var(--red); }
.produto-d { margin-top: 14px; font-size: 15px; color: var(--text); line-height: 1.55; }

/* Adicionais */
.opcs { display: flex; flex-direction: column; gap: 10px; }
.opc { display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
.opc:hover { border-color: #d5d8de; }
.opc.on { border-color: var(--red); background: var(--red-light); }
.opc input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--red); flex-shrink: 0; cursor: pointer; }
.opc-m { flex: 1; min-width: 0; }
.opc-n { display: block; font-size: 16px; font-weight: 600; color: var(--heading); }
.opc-n em { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--field); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
.opc-d { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.opc-v { font-size: 17px; font-weight: 700; color: var(--heading); white-space: nowrap; text-align: right; }
.opc-v small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.qtd { display: inline-flex; align-items: center; gap: 2px; background: var(--field); border-radius: 12px; padding: 3px; margin-top: 10px; }
.qtd button { width: 32px; height: 32px; border: 0; border-radius: 9px; background: #fff; color: var(--heading); font-size: 18px; font-weight: 600; cursor: pointer; }
.qtd button:disabled { opacity: .4; cursor: default; }
.qtd span { min-width: 104px; text-align: center; font-size: 14px; font-weight: 600; color: var(--heading); }

/* Resumo: o cartão escuro com o degradê do hub */
.resumo {
  position: sticky; top: 88px; border-radius: 28px; padding: 24px; color: #fff; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse farthest-corner at 100% 0%, #ff2d5e 0%, #E8003D 16%, rgba(176,0,46,0.55) 34%, rgba(11,11,15,0) 58%), var(--ink);
}
.res-k { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.65); }
.res-n { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; line-height: 1.2; }
.res-s { font-size: 12.5px; color: rgba(255,255,255,0.7); margin-top: 4px; line-height: 1.45; }
.tiles { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.tile { border-radius: 18px; padding: 14px 16px; background: rgba(255,255,255,0.08); }
.tile-l { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tile-t { font-size: 14px; font-weight: 600; }
.tile-v { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.tile-v small { font-size: 12px; font-weight: 500; opacity: .7; }
.tile-d { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 3px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
.tile.destaque .tile-l { flex-direction: column; align-items: flex-start; gap: 2px; }
.tile.destaque .tile-t { display: flex; align-items: center; gap: 8px; }
.tile.destaque { background: #fff; color: var(--heading); }
.tile.destaque .tile-v { font-size: 32px; color: var(--red); }
.tile.destaque .tile-d { color: var(--muted); }
.selo { font-size: 10.5px; font-weight: 600; color: #fff; background: var(--red); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.aparte { margin-top: 10px; border-radius: 16px; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.14); font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,0.8); }
.aparte b { color: #fff; font-weight: 600; }
.aparte-l { display: flex; justify-content: space-between; gap: 10px; }

.desc { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
.cond { display: block; margin: 14px auto 0; border: 0; background: none; color: rgba(255,255,255,0.4); font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px 8px; }
.cond:hover { color: rgba(255,255,255,0.75); }
.tile-de { font-size: 12.5px; color: rgba(255,255,255,0.5); text-decoration: line-through; margin-bottom: 2px; }
.tile.destaque .tile-de { color: var(--dim); }
.desc label { font-size: 12.5px; color: rgba(255,255,255,0.7); flex-shrink: 0; }
.desc input { flex: 1; min-width: 0; font: 600 14px 'Poppins', sans-serif; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 10px 12px; outline: none; }
.desc input:focus { border-color: #fff; }
.desc-tipo { display: flex; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 3px; }
.desc-tipo button { border: 0; background: none; color: rgba(255,255,255,0.7); font-size: 12.5px; font-weight: 600; padding: 7px 11px; border-radius: 9px; cursor: pointer; }
.desc-tipo button.on { background: #fff; color: var(--red); }

.acoes { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.cliente { width: 100%; font: 500 14px 'Poppins', sans-serif; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 12px 14px; outline: none; }
.cliente::placeholder { color: rgba(255,255,255,0.5); }
.cliente:focus { border-color: #fff; }
.acao:disabled { opacity: .6; cursor: wait; }
.acao { border: 0; border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.acao.pri { background: #fff; color: var(--heading); }
.acao.pri:hover { background: #f3f4f6; }
.acao.sec { background: rgba(255,255,255,0.1); color: #fff; }
.acao.sec:hover { background: rgba(255,255,255,0.16); }
.vazio { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 16px; }

/* Celular: o valor do anual fica sempre à vista embaixo */
.barra-cel { display: none; }
@media (max-width: 960px) {
  .barra-cel {
    display: flex; align-items: center; gap: 12px; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 15;
    background: var(--ink); color: #fff; border-radius: 18px; padding: 12px 14px 12px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .barra-cel-t { flex: 1; min-width: 0; font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.3; }
  .barra-cel-t b { display: block; font-size: 17px; color: #fff; }
  .barra-cel button { border: 0; border-radius: 12px; background: var(--red); color: #fff; font-size: 13px; font-weight: 600; padding: 10px 14px; cursor: pointer; }
  .pagina { padding-bottom: 100px; }
}
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--heading); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }

@media (max-width: 960px) {
  .pagina { grid-template-columns: minmax(0, 1fr); padding: 18px 16px 40px; }
  .resumo { position: static; }
}
@media (max-width: 760px) { .recursos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .topo { padding: 0 16px; }
  .topo-t { display: none; }
  .recursos { grid-template-columns: 1fr; }
  .plano-topo { flex-direction: column; }
  .preco { text-align: left; }
  .preco b { font-size: 28px; }
  .bloco { padding: 18px 16px 20px; border-radius: 20px; }
  .resumo { padding: 20px 18px; border-radius: 22px; }
}
</style>
</head>
<body>

<header class="topo">
  <img src="logo-revenda-mais.png" alt="Revenda Mais"/>
  <span class="topo-t">Calculadora de planos</span>
  <button type="button" class="topo-reset" onclick="recomecar()">Recomeçar</button>
</header>

<div class="pagina">
  <nav class="produtos" id="produtos" aria-label="Produto"></nav>
  <div class="passos">
    <section class="bloco" id="blocoPlano"></section>
    <section class="bloco hidden" id="blocoAdd">
      <div class="bloco-t">Adicione ao plano</div>
      <div class="opcs" id="adds"></div>
    </section>
  </div>

  <aside class="resumo" id="resumo"></aside>
</div>

<div class="barra-cel" id="barraCel">
  <span class="barra-cel-t" id="barraCelT"></span>
  <button type="button" onclick="document.getElementById('resumo').scrollIntoView({ behavior: 'smooth' })">Ver valores</button>
</div>

<div class="toast" id="toast"></div>

<script src="precos.js"></script>
<script>
/* Calculadora para mostrar ao cliente. Os preços vêm de precos.js (os mesmos do hub)
   e as regras são as das propostas do hub: anual = mensal − R$ 50 no plano, adesão só no
   mensal do Software Gerencial, CRM e IA à parte no boleto. */

// Produtos avulsos, na ordem dos cards
const AVULSOS = {
  nf:  { nome: 'Nota Fiscal', desc: 'Emissor de NF-e sem o Software Gerencial', mensal: AV_TABELA.nfMensal, anual: AV_TABELA.nfAnual },
  crm: { nome: 'CRM com WhatsApp', desc: AV_TABELA.crmInclusos + ' usuários inclusos · setup de ' + brl(AV_TABELA.crmSetup), mensal: AV_TABELA.crmBase },
  ia:  { nome: 'Agente de IA', desc: 'Pré-vendas no WhatsApp · até ' + AV_TABELA.iaLeads + ' leads por franquia', mensal: AV_TABELA.iaMensal }
};
// Adicionais que aparecem em cada tipo de plano (ids de ADICIONAIS, em precos.js)
const ADD_SOFTWARE = ['nf', 'renave', 'cnpj', 'assin', 'vistoria', 'integra', 'concil'];
// Produtos avulsos se combinam: CRM + Nota Fiscal (+ Renave) + IA com franquias, e assim por diante
function addsAvulso(tipo, add) {
  if (tipo === 'nf') return ['renave', 'cnpj', 'crm', 'ia'];
  const nf = add.nf ? ['nf', 'renave'].concat(tipo === 'ia' && !add.crm ? ['cnpj'] : []) : ['nf'];
  return tipo === 'crm' ? nf.concat(['ia']) : ['crm'].concat(nf);
}
// Qual proposta do hub sai: com Nota Fiscal → modalidades; com CRM → boleto mensal com setup; só IA → boleto
function efetivo(s) {
  const tipo = tipoDa(s.base);
  if (tipo !== 'ia') return tipo;
  return s.add.crm ? 'crm' : s.add.nf ? 'nf' : 'ia';
}

function brl(v) {
  return 'R$ ' + (v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function num(txt) {
  const n = parseFloat(String(txt || '').replace(/\./g, '').replace(',', '.'));
  return isFinite(n) && n > 0 ? n : 0;
}
function adicional(id) { return ADICIONAIS.find(function (a) { return a.id === id; }); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

const INICIAL = function () {
  return { base: '1.0', add: {}, cnpjQtd: 1, crmOn: false, crmUsuarios: AV_TABELA.crmInclusos, iaOn: false, franquias: 1, desc: 0, descTxt: '', descTipo: 'R$', condOn: false, cliente: '' };
};
let st = INICIAL();

function tipoDa(base) { return PLANOS[base] ? 'software' : base; }

// ── Contas (puras: recebem o estado e devolvem os valores) ──
function calcular(s) {
  const tipo = tipoDa(s.base);
  const r = { tipo: tipo, itens: [], aParte: [], setup: 0 };
  // Como no hub: o desconto é um valor em R$ igual em todas as modalidades; em % vira R$ sobre o mensal
  let descR = s.desc;
  const descDe = function (sobre) { return Math.min(sobre, descR); };
  const emReais = function (mensalRef) { if (s.descTipo === '%') descR = mensalRef * Math.min(s.desc, 100) / 100; };
  const crm = avCrmCalc(s.crmUsuarios);

  if (tipo === 'software') {
    const baseM = num(PLANOS[s.base].valor), baseA = Math.max(0, baseM - DESCONTO_ANUAL);
    let addM = 0, addA = 0;
    ADD_SOFTWARE.forEach(function (id) {
      if (!s.add[id]) return;
      const a = adicional(id);
      let m = a.padrao || 0, an = m;
      if (id === 'nf') an = Math.max(0, m - DESCONTO_ANUAL);
      if (id === 'cnpj') { m = an = AV_TABELA.cnpjUnit * s.cnpjQtd; }
      addM += m; addA += an;
      r.itens.push(a.nome + (id === 'cnpj' ? ' (' + s.cnpjQtd + ')' : ''));
    });
    emReais(baseM);   // no Software o desconto abate só o plano
    const descM = descDe(baseM), descA = descDe(baseA);
    r.mensal = baseM + addM - descM;
    r.tri = r.mensal;
    r.anual = baseA + addA - descA;
    r.adesao = ADESAO_FIXA;
    r.economia = (r.mensal - r.anual) * 12 + r.adesao;
    r.descMensal = descM; r.descAnual = descA;
    // Com o Software Gerencial o setup do CRM é bonificado
    if (s.crmOn) { r.aParte.push({ nome: 'CRM com WhatsApp (' + crm.usuarios + ' usuários)', valor: crm.valor }); r.setupBonificado = true; }
    if (s.iaOn) r.aParte.push({ nome: 'Agente de IA (' + s.franquias + (s.franquias === 1 ? ' franquia' : ' franquias') + ')', valor: AV_TABELA.iaMensal * s.franquias });
    r.temIA = s.iaOn;
    return r;
  }

  // Avulsos combinados
  const ef = efetivo(s);
  const temNF = tipo === 'nf' || !!s.add.nf, temCRM = tipo === 'crm' || !!s.add.crm, temIA = tipo === 'ia' || !!s.add.ia;
  const vIA = AV_TABELA.iaMensal * s.franquias;
  const nomeIA = 'Agente de IA (' + s.franquias + (s.franquias === 1 ? ' franquia' : ' franquias') + ')';
  r.tipo = ef;
  r.temIA = temIA;
  r.leads = AV_TABELA.iaLeads * s.franquias;
  if (ef === 'nf') {
    let add = 0;
    if (tipo !== 'nf') r.itens.push('Nota Fiscal');
    if (s.add.renave) { add += AV_TABELA.renave; r.itens.push('Renave'); }
    if (s.add.cnpj) { add += AV_TABELA.cnpjUnit * s.cnpjQtd; r.itens.push('CNPJ Adicional (' + s.cnpjQtd + ')'); }
    if (temCRM) { add += crm.valor; r.itens.push('CRM (' + crm.usuarios + ' usuários)'); r.setup = AV_TABELA.crmSetup; }
    if (temIA) { add += vIA; if (tipo !== 'ia') r.itens.push(nomeIA); }
    if (tipo === 'ia') r.itens.unshift(nomeIA);
    emReais(AV_TABELA.nfMensal + add);   // na Nota Fiscal o desconto abate o total
    const descM = descDe(AV_TABELA.nfMensal + add), descA = descDe(AV_TABELA.nfAnual + add);
    r.mensal = AV_TABELA.nfMensal + add - descM;
    r.tri = r.mensal;
    r.anual = AV_TABELA.nfAnual + add - descA;
    r.adesao = 0;
    r.economia = (r.mensal - r.anual) * 12;
    r.descMensal = descM; r.descAnual = descA;
    return r;
  }
  if (ef === 'crm') {
    let bruto = crm.valor;
    if (tipo === 'ia') r.itens.push('CRM (' + crm.usuarios + ' usuários)');
    if (temNF) { bruto += AV_TABELA.nfMensal; r.itens.push('Nota Fiscal'); }
    if (temNF && s.add.renave) { bruto += AV_TABELA.renave; r.itens.push('Renave'); }
    if (temIA) { bruto += vIA; if (tipo !== 'ia') r.itens.push(nomeIA); }
    emReais(bruto);
    r.descMensal = descDe(bruto);
    r.mensal = bruto - r.descMensal;
    r.setup = AV_TABELA.crmSetup;
    r.usuarios = crm.usuarios;
    return r;
  }
  emReais(vIA);
  r.descMensal = descDe(vIA);
  r.mensal = vIA - r.descMensal;
  return r;
}

// ── Tela ──
// Na calculadora só os planos que a loja costuma usar: até 25, 50 e 100 veículos
const PLANOS_CALC = ['0.5', '1.0', '2.0'];
const PRODUTOS = [['software', 'Software Gerencial'], ['nf', 'Nota Fiscal'], ['crm', 'CRM com WhatsApp'], ['ia', 'Agente de IA']];
let ultimoPlano = '1.0';

function linhaOpc(id, nome, desc, valor, on, extra) {
  return '<label class="opc' + (on ? ' on' : '') + '"><input type="checkbox"' + (on ? ' checked' : '') + ' onchange="marcar(\'' + id + '\', this.checked)"/>' +
    '<span class="opc-m"><span class="opc-n">' + nome + '</span><span class="opc-d">' + esc(desc) + '</span>' + (extra || '') + '</span>' +
    '<span class="opc-v">' + valor + '</span></label>';
}
function stepper(campo, valor, min, rotulo) {
  return '<span class="qtd" onclick="event.preventDefault()">' +
    '<button type="button" onclick="passo(\'' + campo + '\', -1, ' + min + ')"' + (valor <= min ? ' disabled' : '') + ' aria-label="Menos">−</button>' +
    '<span>' + rotulo + '</span>' +
    '<button type="button" onclick="passo(\'' + campo + '\', 1, ' + min + ')" aria-label="Mais">+</button></span>';
}
function preco(mensal, anual) {
  return '<div class="preco"><b>' + brl(mensal) + '</b> <span>/mês</span>' + (anual ? '<small>No anual: ' + brl(anual) + '/mês</small>' : '') + '</div>';
}

function render() {
  const tipo = tipoDa(st.base);
  document.getElementById('produtos').innerHTML = PRODUTOS.map(function (p) {
    return '<button type="button" class="' + (tipo === p[0] ? 'on' : '') + '" onclick="produto(\'' + p[0] + '\')">' + p[1] + '</button>';
  }).join('');
  renderPlano();
  renderAdds();
  renderResumo();
}

// Bloco do plano. No Software Gerencial a faixa de veículos não é redesenhada enquanto arrasta
function renderPlano() {
  const tipo = tipoDa(st.base);
  const box = document.getElementById('blocoPlano');
  const crm = avCrmCalc(st.crmUsuarios);
  if (tipo === 'software') {
    if (box.dataset.tipo !== 'software') {
      box.dataset.tipo = 'software';
      box.innerHTML = '<div class="plano-topo"><div class="plano-q">Quantos veículos há no estoque?<small>Software Gerencial</small></div><div id="planoPreco"></div></div>' +
        '<div class="faixa-box"><div class="marcas" id="marcas">' + PLANOS_CALC.map(function (k, i) {
          return '<button type="button" onclick="escolherPlano(' + i + ')">' + PLANOS[k].veiculos + '<small>veículos</small></button>';
        }).join('') + '</div>' +
        '<input type="range" class="faixa" id="faixa" min="0" max="' + (PLANOS_CALC.length - 1) + '" step="1" aria-label="Veículos no estoque" oninput="escolherPlano(this.value)"/>' +
        '<div class="plano-info" id="planoInfo"></div></div>' +
        '<div class="recursos-t">O que vem no plano</div><ul class="recursos" id="recursos"></ul>';
    }
    const i = PLANOS_CALC.indexOf(st.base), p = PLANOS[st.base], v = num(p.valor);
    const faixa = document.getElementById('faixa');
    faixa.value = i;
    faixa.style.setProperty('--p', (i * 100 / (PLANOS_CALC.length - 1)) + '%');
    document.querySelectorAll('#marcas button').forEach(function (b, k) { b.classList.toggle('on', k === i); });
    document.getElementById('planoPreco').innerHTML = preco(v, Math.max(0, v - DESCONTO_ANUAL));
    document.getElementById('planoInfo').innerHTML = '<b>Plano ' + esc(st.base) + '</b> · até ' + p.veiculos + ' veículos · ' + p.usuarios + ' usuários';
    document.getElementById('recursos').innerHTML = RECURSOS_PADRAO.map(function (r) {
      return '<li' + (p.desmarcados.indexOf(r) !== -1 ? ' class="nao"' : '') + '>' + esc(r) + '</li>';
    }).join('');
    return;
  }
  box.dataset.tipo = tipo;
  const a = AVULSOS[tipo];
  let h;
  if (tipo === 'nf') {
    h = '<div class="plano-topo"><div class="plano-q">' + a.nome + '<small>Sem o Software Gerencial</small></div>' + preco(a.mensal, a.anual) + '</div>' +
      '<p class="produto-d">Emissor de nota fiscal eletrônica.</p>';
  } else if (tipo === 'crm') {
    h = '<div class="plano-topo"><div class="plano-q">' + a.nome + '<small>Cobrado no boleto, pós-pago</small></div>' + preco(crm.valor) + '</div>' +
      '<p class="produto-d">' + AV_TABELA.crmInclusos + ' usuários inclusos e ' + brl(AV_TABELA.crmExtra) + ' por usuário a mais. Setup de ' + brl(AV_TABELA.crmSetup) + ', pago uma vez.</p>' +
      stepper('crmUsuarios', st.crmUsuarios, 1, crm.usuarios + ' usuários');
  } else {
    h = '<div class="plano-topo"><div class="plano-q">' + a.nome + '<small>Pré-vendas no WhatsApp</small></div>' + preco(AV_TABELA.iaMensal * st.franquias) + '</div>' +
      '<p class="produto-d">Cada franquia atende até ' + AV_TABELA.iaLeads + ' leads por mês. Lead excedente: ' + brl(AV_TABELA.iaExcedente) + '. Sem fidelidade.</p>' +
      stepper('franquias', st.franquias, 1, st.franquias + (st.franquias === 1 ? ' franquia' : ' franquias'));
  }
  box.innerHTML = h;
}

function renderAdds() {
  const tipo = tipoDa(st.base);
  const crm = avCrmCalc(st.crmUsuarios);
  const lista = tipo === 'software' ? ADD_SOFTWARE.concat(['crmOn', 'iaOn']) : addsAvulso(tipo, st.add);
  const aParte = ' <em>boleto à parte</em>';
  document.getElementById('blocoAdd').classList.toggle('hidden', !lista.length);
  document.getElementById('adds').innerHTML = lista.map(function (id) {
    const a = adicional(id), on = !!st.add[id];
    if (id === 'crmOn') return linhaOpc(id, 'CRM com WhatsApp' + aParte, AV_TABELA.crmInclusos + ' usuários inclusos · ' + brl(AV_TABELA.crmExtra) + ' por usuário a mais · setup bonificado',
      brl(crm.valor) + '<small>/mês</small>', st.crmOn, st.crmOn ? stepper('crmUsuarios', st.crmUsuarios, 1, crm.usuarios + ' usuários') : '');
    if (id === 'iaOn') return linhaOpc(id, 'Agente de IA' + aParte, 'Cada franquia atende até ' + AV_TABELA.iaLeads + ' leads por mês · excedente ' + brl(AV_TABELA.iaExcedente) + ' por lead',
      brl(AV_TABELA.iaMensal * st.franquias) + '<small>/mês</small>', st.iaOn, st.iaOn ? stepper('franquias', st.franquias, 1, st.franquias + (st.franquias === 1 ? ' franquia' : ' franquias')) : '');
    if (id === 'cnpj') return linhaOpc(id, esc(a.nome), 'Emita e receba notas em CNPJs diferentes', brl(AV_TABELA.cnpjUnit * st.cnpjQtd) + '<small>/mês</small>', on,
      on ? stepper('cnpjQtd', st.cnpjQtd, 1, st.cnpjQtd + (st.cnpjQtd === 1 ? ' CNPJ' : ' CNPJs')) : '');
    if (id === 'crm') return linhaOpc(id, esc(a.nome), AV_TABELA.crmInclusos + ' usuários inclusos · ' + brl(AV_TABELA.crmExtra) + ' por usuário a mais · setup de ' + brl(AV_TABELA.crmSetup), brl(crm.valor) + '<small>/mês</small>', on,
      on ? stepper('crmUsuarios', st.crmUsuarios, 1, crm.usuarios + ' usuários') : '');
    if (id === 'nf') return linhaOpc(id, esc(a.nome), a.desc, brl(a.padrao) + '<small>' + (tipo === 'software' ? 'no anual: ' + brl(a.padrao - DESCONTO_ANUAL) : '/mês') + '</small>', on);
    if (id === 'ia') return linhaOpc(id, 'Agente de IA', 'Cada franquia atende até ' + AV_TABELA.iaLeads + ' leads por mês · excedente ' + brl(AV_TABELA.iaExcedente) + ' por lead',
      brl(AV_TABELA.iaMensal * st.franquias) + '<small>/mês</small>', on, on ? stepper('franquias', st.franquias, 1, st.franquias + (st.franquias === 1 ? ' franquia' : ' franquias')) : '');
    if (id === 'renave' && tipo !== 'software') return linhaOpc(id, esc(a.nome), 'Junto com a Nota Fiscal · ' + a.desc, brl(a.padrao) + '<small>/mês</small>', on);
    return linhaOpc(id, esc(a.nome), a.desc, brl(a.padrao) + '<small>/mês</small>', on);
  }).join('');
}

function nomeBase() {
  return PLANOS[st.base] ? (PLANOS[st.base].nome || 'Plano ' + st.base) : AVULSOS[st.base].nome;
}

function renderResumo() {
  const r = calcular(st);
  const plano = PLANOS[st.base];
  const sub = plano ? (st.base === 'integrador' ? 'Integrador de anúncios' : 'Software Gerencial · até ' + plano.veiculos + ' veículos, ' + plano.usuarios + ' usuários') : AVULSOS[st.base].desc;
  let h = '<div class="res-k">Investimento</div><div class="res-n">' + esc(nomeBase()) + '</div>' +
    '<div class="res-s">' + esc(sub) + (r.itens.length ? '<br/>+ ' + esc(r.itens.join(', ')) : '') + '</div><div class="tiles">';

  if (r.tipo === 'software' || r.tipo === 'nf') {
    h += tile('Mensal', brl(r.mensal) + '<small>/mês</small>', ['Boleto/PIX ou cartão', r.adesao ? 'Adesão de ' + brl(r.adesao) : 'Sem adesão'], false, r.descMensal ? r.mensal + r.descMensal : 0) +
      tile('Anual', '12x ' + brl(r.anual), ['ou ' + brl(r.anual * 12) + ' no boleto', r.economia > 0 ? 'Economia de ' + brl(r.economia) + ' no ano' : 'Sem adesão'], true, r.descAnual ? r.anual + r.descAnual : 0);
  } else if (r.tipo === 'crm') {
    h += tile('Mensal no boleto', brl(r.mensal) + '<small>/mês</small>', ['Pós-pago, na virada do mês', r.usuarios + ' usuários'], true, r.descMensal ? r.mensal + r.descMensal : 0);
  } else {
    h += tile('Mensal no boleto', brl(r.mensal) + '<small>/mês</small>', ['Até ' + r.leads.toLocaleString('pt-BR') + ' leads por mês', 'Sem fidelidade'], true, r.descMensal ? r.mensal + r.descMensal : 0);
  }
  h += '</div>';

  if (r.aParte.length || r.setup || r.setupBonificado || r.temIA) {
    h += '<div class="aparte">' +
      (r.aParte.length ? '<div>Cobrado à parte, no boleto mensal:</div>' + r.aParte.map(function (a) {
        return '<div class="aparte-l"><span>' + esc(a.nome) + '</span><b>' + brl(a.valor) + '/mês</b></div>';
      }).join('') : '') +
      (r.setup ? '<div class="aparte-l"><span>Setup do CRM (uma vez)</span><b>' + brl(r.setup) + '</b></div>' : '') +
      (r.setupBonificado ? '<div class="aparte-l"><span>Setup do CRM</span><b><s style="opacity:.6;font-weight:500">' + brl(AV_TABELA.crmSetup) + '</s> bonificado</b></div>' : '') +
      (r.temIA ? '<div class="aparte-l"><span>Lead acima da franquia</span><b>' + brl(AV_TABELA.iaExcedente) + ' cada</b></div>' : '') +
    '</div>';
  }

  h += '<div class="desc' + (st.condOn ? '' : ' hidden') + '"><label for="desc">Desconto</label>' +
    '<input id="desc" inputmode="decimal" placeholder="0" value="' + esc(st.descTxt) + '" oninput="descontar(this.value)"/>' +
    '<div class="desc-tipo"><button type="button" class="' + (st.descTipo === 'R$' ? 'on' : '') + '" onclick="tipoDesc(\'R$\')">R$</button>' +
    '<button type="button" class="' + (st.descTipo === '%' ? 'on' : '') + '" onclick="tipoDesc(\'%\')">%</button></div></div>' +
    '<div class="acoes"><input class="cliente" id="cliente" placeholder="Nome do cliente / loja" autocomplete="off" value="' + esc(st.cliente) + '" oninput="st.cliente = this.value"/>' +
    '<button type="button" class="acao pri" id="btnPdf" onclick="gerarPdf()">Gerar proposta (PDF)</button>' +
    '<button type="button" class="acao sec" onclick="copiarWhats()">Copiar para o WhatsApp</button></div>' +
    '<button type="button" class="cond" onclick="condicao()">' + (st.condOn ? 'Fechar condição especial' : 'Condição especial') + '</button>';

  document.getElementById('barraCelT').innerHTML = esc(nomeBase()) + '<b>' +
    (r.tipo === 'software' || r.tipo === 'nf' ? 'Anual 12x ' + brl(r.anual) : brl(r.mensal) + '/mês') + '</b>';
  const box = document.getElementById('resumo');
  const foco = document.activeElement && (document.activeElement.id === 'desc' || document.activeElement.id === 'cliente') ? document.activeElement.id : null;
  box.innerHTML = h;
  if (foco) { const d = document.getElementById(foco); d.focus(); d.setSelectionRange(d.value.length, d.value.length); }
}
function tile(titulo, valor, linhas, destaque, de) {
  return '<div class="tile' + (destaque ? ' destaque' : '') + '">' + (de ? '<div class="tile-de">de ' + brl(de) + '</div>' : '') + '<div class="tile-l"><span class="tile-t">' + titulo +
    (destaque && tipoDa(st.base) !== 'crm' && tipoDa(st.base) !== 'ia' ? ' <span class="selo">Melhor oferta</span>' : '') + '</span>' +
    '<span class="tile-v">' + valor + '</span></div><div class="tile-d"><span>' + linhas[0] + '</span><span>' + linhas[1] + '</span></div></div>';
}

// ── Ações ──
function produto(tipo) {
  if (tipo === tipoDa(st.base)) return;
  st.add = {}; st.crmOn = false; st.iaOn = false; st.desc = 0; st.descTxt = ''; st.condOn = false;
  st.base = tipo === 'software' ? ultimoPlano : tipo;
  render();
}
function escolherPlano(i) {
  st.base = ultimoPlano = PLANOS_CALC[+i];
  renderPlano();
  renderResumo();
}
function marcar(id, on) {
  if (id === 'crmOn' || id === 'iaOn') st[id] = on; else st.add[id] = on;
  // Renave e CNPJ adicional vão junto com a Nota Fiscal
  if (tipoDa(st.base) !== 'software' && tipoDa(st.base) !== 'nf' && !st.add.nf) { st.add.renave = false; st.add.cnpj = false; }
  if (tipoDa(st.base) === 'ia' && st.add.crm) st.add.cnpj = false;
  render();
}
function passo(campo, delta, min) {
  st[campo] = Math.max(min, Math.min(campo === 'crmUsuarios' ? 100 : 50, st[campo] + delta));
  render();
}
function descontar(v) { st.descTxt = v; st.desc = num(v); renderResumo(); }
function tipoDesc(t) { st.descTipo = t; renderResumo(); }
// "Condição especial": o campo de desconto fica guardado até o vendedor abrir
function condicao() {
  st.condOn = !st.condOn;
  if (!st.condOn) { st.desc = 0; st.descTxt = ''; }
  renderResumo();
  if (st.condOn) document.getElementById('desc').focus();
}
function recomecar() { st = INICIAL(); ultimoPlano = st.base; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function textoWhats() {
  const r = calcular(st);
  const l = ['*Proposta Revenda Mais*', nomeBase() + (r.itens.length ? ' + ' + r.itens.join(', ') : ''), ''];
  if (r.tipo === 'software' || r.tipo === 'nf') {
    l.push('Mensal: ' + brl(r.mensal) + '/mês' + (r.adesao ? ' + adesão de ' + brl(r.adesao) : ''));
    l.push('*Anual: 12x de ' + brl(r.anual) + '* (ou ' + brl(r.anual * 12) + ' no boleto)' + (r.economia > 0 ? ', economia de ' + brl(r.economia) + ' no ano' : ''));
  } else if (r.tipo === 'crm') {
    l.push('Mensal no boleto (pós-pago): ' + brl(r.mensal) + '/mês, ' + r.usuarios + ' usuários');
  } else {
    l.push('Mensal no boleto: ' + brl(r.mensal) + '/mês, até ' + r.leads.toLocaleString('pt-BR') + ' leads. Lead excedente: ' + brl(AV_TABELA.iaExcedente) + '. Sem fidelidade.');
  }
  if (r.aParte.length) l.push('', 'À parte, no boleto mensal: ' + r.aParte.map(function (a) { return a.nome + ' ' + brl(a.valor); }).join('; '));
  if (r.setup) l.push('Setup do CRM: ' + brl(r.setup) + ' (uma vez)');
  if (r.setupBonificado) l.push('Setup do CRM (' + brl(AV_TABELA.crmSetup) + '): bonificado');
  return l.join('\n');
}
function copiarWhats() {
  const t = textoWhats();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { aviso('Copiado. É só colar no WhatsApp.'); },
    function () { window.prompt('Copie o texto:', t); });
}

// Leva a escolha para a Proposta Comercial do hub (outra aba, só o vendedor vê)
function dadosParaHub() {
  const r = calcular(st), tipo = tipoDa(st.base);
  const crm = avCrmCalc(st.crmUsuarios);
  const p = { tipo: tipo === 'software' ? 'software' : 'avulso', forma_pagamento: 'ambos',
    modalidades: { mensal: true, trimestral: false, anual: true }, desconto: Math.round(r.descMensal * 100) / 100 };
  if (tipo === 'software') {
    p.plano = st.base;
    p.adicionais = ADD_SOFTWARE.filter(function (id) { return st.add[id]; }).map(function (id) {
      return { id: id, valor_mensal: id === 'cnpj' ? AV_TABELA.cnpjUnit * st.cnpjQtd : adicional(id).padrao };
    });
    if (st.crmOn) p.adicionais.push({ id: 'crm', valor_mensal: crm.valor });
    if (st.iaOn) p.adicionais.push({ id: 'ia', valor_mensal: AV_TABELA.iaMensal * st.franquias });
    p.crm_usuarios = crm.usuarios;
  } else {
    const ef = efetivo(st);
    const temNF = tipo === 'nf' || !!st.add.nf, temCRM = tipo === 'crm' || !!st.add.crm, temIA = tipo === 'ia' || !!st.add.ia;
    p.avulso_plano = ef;
    p.avulso_adicionais = ef === 'nf'
      ? [st.add.renave && 'renave', st.add.cnpj && 'cnpj', temCRM && 'crm', temIA && 'ia'].filter(Boolean)
      : ef === 'crm' ? [temNF && 'nfe', temNF && st.add.renave && 'renave', temIA && 'ia'].filter(Boolean) : [];
    p.cnpj_qtd = st.cnpjQtd;
    p.crm_usuarios = crm.usuarios;
    p.ia_franquias = st.franquias;
  }
  return p;
}

// Gerar a proposta: o hub roda escondido nesta página (mesmo site) e gera o mesmo PDF da aba Propostas,
// com o consultor do perfil salvo neste navegador. O cliente só vê o PDF baixando.
let hubPronto = null;
function hubOculto() {
  if (!hubPronto) hubPronto = new Promise(function (ok, erro) {
    const f = document.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.tabIndex = -1;
    f.style.cssText = 'position:fixed;left:-10000px;top:0;width:1280px;height:900px;border:0';
    f.onload = function () { f.contentWindow.document.fonts.ready.then(function () { ok(f.contentWindow); }); };
    f.onerror = function () { hubPronto = null; erro(new Error('Não consegui abrir o gerador.')); };
    f.src = './';
    document.body.appendChild(f);
  });
  return hubPronto;
}
async function gerarPdf() {
  const nome = (st.cliente || '').trim();
  if (!nome) { document.getElementById('cliente').focus(); return aviso('Coloque o nome do cliente para a proposta.'); }
  const btn = document.getElementById('btnPdf');
  btn.disabled = true; btn.textContent = 'Gerando PDF…';
  try {
    const w = await hubOculto();
    w.iaPreencherProposta(dadosParaHub());
    w.document.getElementById('p_cliente').value = nome;
    await w.gerarProposta('pdf');
    aviso('Proposta gerada. O PDF foi baixado.');
  } catch (e) {
    console.error(e);
    aviso('Não deu para gerar o PDF. Tente de novo.');
  } finally {
    const b = document.getElementById('btnPdf');
    if (b) { b.disabled = false; b.textContent = 'Gerar proposta (PDF)'; }
  }
}

function aviso(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(aviso.t); aviso.t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

render();
</script>
